<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MINECRAFT 3D // ULTIMATE VOXEL SANDBOX</title>
  <meta name="description" content="Полноценный 3D Minecraft в браузере с 60 FPS, процедурными вокселями, шейдерами, мультиплеером, крафтом, мобами и сохранением миров.">

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D Three.js Game Container -->
  <div id="game-container"></div>

  <!-- 3D Crosshair -->
  <div class="mc-crosshair" id="mc-crosshair">+</div>

  <!-- 0. MAIN LOBBY SCREEN -->
  <div class="mc-lobby-screen" id="screen-mc-lobby">
    <div class="mc-menu-panel">
      <div class="mc-logo-title">MINECRAFT 3D</div>
      <div class="mc-logo-sub">ВОКСЕЛЬНОЕ ВЫЖИВАНИЕ & СЕТЕВЫЕ СЕРВЕРЫ</div>

      <!-- Player Profile Setup -->
      <div class="profile-setup-box">
        <div class="form-group-inline">
          <label>НИКНЕЙМ:</label>
          <input type="text" id="mc-player-name" class="mc-input" value="Стив" maxlength="16">
        </div>
        <div class="mc-skins-row">
          <div class="mc-skin-dot active" data-color="#00aaaa" style="background: #00aaaa;" title="Стив"></div>
          <div class="mc-skin-dot" data-color="#55aa55" style="background: #55aa55;" title="Алекс"></div>
          <div class="mc-skin-dot" data-color="#aa0000" style="background: #aa0000;" title="Рыцарь"></div>
          <div class="mc-skin-dot" data-color="#8800aa" style="background: #8800aa;" title="Маг"></div>
          <div class="mc-skin-dot" data-color="#222222" style="background: #222222;" title="Тень"></div>
        </div>
      </div>

      <!-- Lobby Mode Tabs -->
      <div class="lobby-tabs-header">
        <button class="tab-btn active" id="tab-btn-single">🕹 МОИ 3D МИРЫ</button>
        <button class="tab-btn" id="tab-btn-multi">🌐 СЕТЕВЫЕ СЕРВЕРЫ</button>
      </div>

      <!-- TAB 1: SINGLEPLAYER & SAVED WORLDS -->
      <div class="tab-content" id="tab-view-single">
        <button class="btn-mc-primary" id="btn-create-single-world">➕ СОЗДАТЬ НОВЫЙ 3D МИР</button>
        <div class="worlds-scroll-list" id="local-worlds-list">
          <!-- Populated from LocalStorage -->
        </div>
      </div>

      <!-- TAB 2: MULTIPLAYER SERVERS & CODE -->
      <div class="tab-content hidden" id="tab-view-multi">
        <div class="create-server-box">
          <input type="text" id="mc-online-world-name" class="mc-input" placeholder="Название сервера..." value="3D Сервер Стива" maxlength="20">
          <button class="btn-mc-primary" id="btn-mc-create-online">⚡ СОЗДАТЬ СЕРВЕР</button>
        </div>

        <hr class="mc-divider">

        <div class="join-room-row">
          <input type="text" id="mc-room-code" class="mc-input code-input" placeholder="КОД МИРА (MC...)">
          <button class="btn-mc-primary" id="btn-mc-join-online">🔗 ВОЙТИ</button>
        </div>

        <div class="server-list-header">
          <span>ОТКРЫТЫЕ 3D СЕРВЕРЫ:</span>
          <button class="btn-mc btn-sm" id="btn-refresh-servers">🔄 ОБНОВИТЬ</button>
        </div>

        <div class="worlds-scroll-list" id="public-servers-list">
          <!-- Public Firestore Servers -->
        </div>
      </div>

    </div>
  </div>

  <!-- 1. IN-GAME 3D HUD -->
  <div class="mc-hud hidden" id="mc-hud">
    <!-- Top Bar -->
    <div class="hud-top-bar">
      <div class="hud-badges-group">
        <div class="hud-title-badge">MINECRAFT 3D</div>
        <div class="hud-room-badge hidden" id="hud-mc-room-tag" title="Нажмите, чтобы скопировать код другу">КОМНАТА: MC...</div>
      </div>
      <div class="hud-help-tip">Кликните по экрану для управления камерой (ESC — пауза)</div>
    </div>

    <!-- Chat Feed -->
    <div class="hud-mc-chat-container">
      <div class="hud-mc-chat-feed" id="hud-mc-chat-feed"></div>
    </div>

    <!-- Bottom Status & Hotbar -->
    <div class="hud-bottom-center">
      <div class="status-bars-row">
        <div id="hud-hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
        <div id="hud-hunger">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
      </div>

      <div class="hotbar-container">
        <div class="hotbar-slots" id="hotbar-slots">
          <!-- 9 Hotbar Slots -->
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Banner -->
  <div class="hud-notification" id="hud-notification"></div>

  <!-- 2. INVENTORY & CRAFTING MODAL (PRESS 'E') -->
  <div class="mc-modal" id="modal-inventory">
    <div class="inventory-box">
      <div>
        <div class="inv-section-title">ИНВЕНТАРЬ (36 СЛОТОВ)</div>
        <div class="inventory-slots-grid" id="inventory-slots-grid"></div>
        <button class="btn-mc" id="btn-close-inv" style="margin-top: 14px; width: 100%;">✕ ЗАКРЫТЬ [E]</button>
      </div>

      <div class="crafting-section">
        <div class="inv-section-title">КРАФТ (РЕЦЕПТЫ)</div>
        <div class="crafting-recipes-list" id="crafting-recipes-list"></div>
      </div>
    </div>
  </div>

  <!-- 3. IN-GAME PAUSE MENU (PRESS 'ESC') -->
  <div class="mc-modal" id="modal-pause">
    <div class="pause-menu-panel">
      <div class="pause-title">МЕНЮ ПАУЗЫ</div>
      <button class="btn-mc-primary btn-lg" id="btn-resume-game">▶ ПРОДОЛЖИТЬ ИГРУ</button>
      <button class="btn-mc btn-lg" id="btn-pause-save">💾 СОХРАНИТЬ МИР</button>
      <button class="btn-mc-danger btn-lg" id="btn-exit-to-menu">🚪 ВЫЙТИ В ГЛАВНОЕ МЕНЮ</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="src/app.js"></script>

</body>
</html>
