<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D CITY ONLINE // GTA SANDBOX MULTIPLAYER</title>
  <meta name="description" content="3D мультиплеерная песочница в мегаполисе: угон спорткаров, поездки втроем с друзьями, погони полиции со звездами, перестрелки и открытый мир.">

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D Three.js Game Container -->
  <div id="game-container"></div>

  <!-- Crosshair -->
  <div class="mc-crosshair" id="mc-crosshair">⊹</div>

  <!-- 0. MAIN LOBBY SCREEN -->
  <div class="mc-lobby-screen" id="screen-mc-lobby">
    <div class="mc-menu-panel">
      <div class="mc-logo-title">3D CITY ONLINE</div>
      <div class="mc-logo-sub">GTA SANDBOX • УГОН ТАЧЕК • ПОЛИЦИЯ • МУЛЬТИПЛЕЕР</div>

      <!-- Player Profile Setup -->
      <div class="profile-setup-box">
        <div class="form-group-inline">
          <label>НИКНЕЙМ:</label>
          <input type="text" id="mc-player-name" class="mc-input" value="Стив" maxlength="16">
        </div>
        <div class="mc-skins-row">
          <div class="mc-skin-dot active" data-color="#00aaaa" style="background: #00aaaa;" title="Бирюзовый"></div>
          <div class="mc-skin-dot" data-color="#55aa55" style="background: #55aa55;" title="Зеленый"></div>
          <div class="mc-skin-dot" data-color="#aa0000" style="background: #aa0000;" title="Красный"></div>
          <div class="mc-skin-dot" data-color="#8800aa" style="background: #8800aa;" title="Фиолетовый"></div>
          <div class="mc-skin-dot" data-color="#222222" style="background: #222222;" title="Черный"></div>
        </div>
      </div>

      <!-- Lobby Mode Tabs -->
      <div class="lobby-tabs-header">
        <button class="tab-btn active" id="tab-btn-multi">🌐 СЕТЕВОЙ ГОРОД</button>
        <button class="tab-btn" id="tab-btn-single">🕹 ОДИНОЧНАЯ ИГРА</button>
      </div>

      <!-- TAB 1: MULTIPLAYER -->
      <div class="tab-content" id="tab-view-multi">
        <div class="create-server-box">
          <input type="text" id="mc-online-world-name" class="mc-input" placeholder="Название сервера..." value="Сервер Мегаполис" maxlength="20">
          <button class="btn-mc-primary" id="btn-mc-create-online">⚡ СОЗДАТЬ СЕРВЕР</button>
        </div>

        <hr class="mc-divider">

        <div class="join-room-row">
          <input type="text" id="mc-room-code" class="mc-input code-input" placeholder="ВВЕДИТЕ КОД (GTA...)">
          <button class="btn-mc-primary" id="btn-mc-join-online">🔗 ВОЙТИ</button>
        </div>

        <div class="server-list-header">
          <span>ОТКРЫТЫЕ ГОРОДА:</span>
          <button class="btn-mc btn-sm" id="btn-refresh-servers">🔄 ОБНОВИТЬ</button>
        </div>

        <div class="worlds-scroll-list" id="public-servers-list"></div>
      </div>

      <!-- TAB 2: SINGLEPLAYER -->
      <div class="tab-content hidden" id="tab-view-single">
        <button class="btn-mc-primary" id="btn-create-single-world">➕ ИГРАТЬ В ОДИНОЧКУ</button>
      </div>

    </div>
  </div>

  <!-- 1. GTA STYLE IN-GAME HUD -->
  <div class="mc-hud hidden" id="mc-hud">
    <!-- Top Left Room Code & Tip -->
    <div class="hud-top-bar">
      <div class="hud-badges-group">
        <div class="hud-title-badge">3D CITY</div>
        <div class="hud-room-badge hidden" id="hud-mc-room-tag">СЕРВЕР: GTA...</div>
      </div>
      <div class="hud-help-tip">[F / E] — Сесть / Выйти из машины | [1-4] — Оружие | [ЛКМ] — Стрелять / Газ</div>
    </div>

    <!-- Top Right: Wanted Stars, Money, HP & Armor -->
    <div class="gta-top-right">
      <div class="wanted-stars" id="hud-wanted-stars">☆☆☆☆☆</div>
      <div class="gta-money" id="hud-money">$2,500</div>
      <div class="status-bars-gta">
        <div class="bar-wrap hp-wrap"><div class="bar-fill hp-fill" id="hud-hp-bar"></div></div>
        <div class="bar-wrap ap-wrap"><div class="bar-fill ap-fill" id="hud-ap-bar"></div></div>
      </div>
    </div>

    <!-- Chat Feed -->
    <div class="hud-mc-chat-container">
      <div class="hud-mc-chat-feed" id="hud-mc-chat-feed"></div>
    </div>

    <!-- Bottom Right: Speedometer & Weapon -->
    <div class="gta-bottom-right">
      <div class="hud-speedometer hidden" id="hud-speedometer">0 КМ/Ч</div>
      <div class="hud-weapon-badge" id="hud-active-weapon">🔫 Пистолет 9mm</div>
    </div>
  </div>

  <!-- Notification Banner -->
  <div class="hud-notification" id="hud-notification"></div>

  <!-- 2. IN-GAME PAUSE MENU (PRESS 'ESC') -->
  <div class="mc-modal" id="modal-pause">
    <div class="pause-menu-panel">
      <div class="pause-title">МЕНЮ ПАУЗЫ</div>
      <button class="btn-mc-primary btn-lg" id="btn-resume-game">▶ ПРОДОЛЖИТЬ ИГРУ</button>
      <button class="btn-mc-danger btn-lg" id="btn-exit-to-menu">🚪 ВЫЙТИ В ГЛАВНОЕ МЕНЮ</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="src/app.js"></script>

</body>
</html>
